name: Build APK with EAS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview or production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Authenticate with Expo
        run: eas login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Build APK with EAS
        working-directory: souk/apps/mobile
        run: eas build -p android --profile ${{ github.event.inputs.profile }} --non-interactive

      - name: Display build info
        run: |
          echo "Build completed successfully!"
          echo "Profile: ${{ github.event.inputs.profile }}"
          echo "The APK is being processed by EAS and will be available in your Expo dashboard at:"
          echo "https://expo.dev/"
          echo ""
          echo "To download the APK:"
          echo "1. Go to https://expo.dev/ and sign in"
          echo "2. Navigate to your project 'Souk'"
          echo "3. Find the build under Builds → Android"
          echo "4. Click Download to get the APK"

      - name: Create build summary
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ APK build completed successfully!\n\nProfile: `${{ github.event.inputs.profile }}`\n\nThe build can be downloaded from your Expo dashboard: https://expo.dev/'
            });
